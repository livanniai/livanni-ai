<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Livanni AI</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #131314;
    --surface: #1e1f20;
    --surface-hover: #2d2e30;
    --text: #e3e3e3;
    --text-muted: #c4c7c5;
    --accent: #8ab4f8;
    --accent-hover: #aecbfa;
    --border: #3c4043;
    --error: #f28b82;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }

  /* Sol Kenar Çubuğu */
  aside { width: 280px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 16px; gap: 12px; }
  .brand { font-size: 16px; font-weight: 500; display: flex; align-items: center; gap: 8px; padding: 8px; color: var(--text); }
  .new-chat-btn { background: var(--surface-hover); color: var(--text); border: 1px solid var(--border); padding: 10px 16px; border-radius: 24px; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 8px; width: fit-content; font-weight: 500; }
  .new-chat-btn:hover { background: var(--border); }

  /* Model Seçim Alanı */
  .model-selector { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .model-selector label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .model-select { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 8px; font-size: 13px; outline: none; cursor: pointer; }

  .menu-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; margin-top: 10px; }
  .menu-item { padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .menu-item:hover, .menu-item.active { background: var(--surface-hover); color: var(--text); }

  .user-bar { border-top: 1px solid var(--border); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; font-size: 12px; color: var(--text-muted); }
  .user-bar button { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 6px; cursor: pointer; }
  .user-bar button:hover { background: var(--surface-hover); }

  /* Ana İçerik Alanı */
  .main-container { flex: 1; display: flex; flex-direction: column; height: 100vh; background: var(--bg); position: relative; }
  header { padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; font-size: 15px; font-weight: 500; color: var(--text-muted); }

  main { flex: 1; max-width: 800px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; padding: 0 20px 20px 20px; overflow: hidden; }
  .messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; padding-bottom: 20px; }
  .msg { padding: 12px 16px; border-radius: 12px; max-width: 85%; font-size: 14px; line-height: 1.6; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--surface-hover); color: var(--text); border-bottom-right-radius: 4px; }
  .msg.ai { align-self: flex-start; background: var(--surface); color: var(--text); border-bottom-left-radius: 4px; }
  .msg img { max-width: 100%; border-radius: 8px; margin-top: 8px; display: block; }

  /* Giriş Kutusu */
  .input-container { background: var(--surface); border: 1px solid var(--border); border-radius: 28px; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
  .input-row { display: flex; align-items: center; gap: 10px; }
  textarea { flex: 1; background: transparent; border: none; color: var(--text); font-size: 14px; outline: none; resize: none; max-height: 120px; font-family: inherit; }
  .send-btn { background: var(--accent); color: var(--bg); border: none; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; }
  .send-btn:hover { background: var(--accent-hover); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .hint-row { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); padding: 0 4px; }

  /* Giriş Ekranı */
  .auth-overlay { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .authBox { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 32px; }
  .authBox h2 { margin-top: 0; font-size: 20px; margin-bottom: 20px; color: var(--text); }
  .authBox label { font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 6px; }
  .authBox input { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 16px; width: 100%; padding: 10px 12px; color: var(--text); outline: none; }
  .authBox button { width: 100%; background: var(--accent); border: none; color: var(--bg); padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer; }
  .authBox .switchLink { font-size: 13px; color: var(--accent); cursor: pointer; margin-top: 16px; text-align: center; display: block; }
  .authError { color: var(--error); font-size: 12px; margin-top: 10px; text-align: center; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- Giriş Ekranı -->
<div id="authScreen" class="auth-overlay">
  <div class="authBox">
    <h2 id="authTitle">Giriş Yap</h2>
    <label>E-posta Adresi</label>
    <input type="email" id="authEmail" placeholder="ornek@mail.com" />
    <label>Şifre</label>
    <input type="password" id="authPassword" placeholder="••••••••" />
    <button id="authSubmit">Giriş Yap</button>
    <div class="authError" id="authError"></div>
    <div class="switchLink" id="authSwitch">Hesabın yok mu? Kayıt ol</div>
  </div>
</div>

<!-- Sol Menü -->
<aside>
  <div class="brand">✨ Livanni AI</div>
  <button class="new-chat-btn" id="newChatBtn">＋ Yeni Sohbet</button>
  
  <div class="model-selector">
    <label>Yapay Zeka Modeli</label>
    <select id="modelSelect" class="model-select">
      <option value="gemini">Gemini Pro</option>
      <option value="claude">Claude Sonnet</option>
    </select>
  </div>

  <div style="font-size: 11px; color: var(--text-muted); margin-top: 15px; text-transform: uppercase; letter-spacing: 0.5px;">Sohbet Geçmişi</div>
  <div class="menu-list" id="chatHistoryList">
    <div class="menu-item active" onclick="loadSession(0)">Aktif Sohbet</div>
  </div>

  <div class="user-bar">
    <div id="userEmail" style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"></div>
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span id="limitBadge" style="font-size: 11px;">Limit: --/--</span>
      <button id="logoutBtn">Çıkış</button>
    </div>
  </div>
</aside>

<!-- Ana Ekran -->
<div class="main-container">
  <header>
    <div id="topTitle">Livanni AI Asistan</div>
    <div id="status" style="font-size: 13px;">Hazır</div>
  </header>

  <main>
    <div class="messages" id="messages">
      <div class="msg ai">Merhaba! Ben Livanni AI. Bugün sana nasıl yardımcı olabilirim?</div>
    </div>

    <div class="input-container">
      <div class="input-row">
        <textarea id="input" rows="1" placeholder="Livanni AI'a bir şeyler sorun..." autocomplete="off"></textarea>
        <button id="sendBtn" class="send-btn">↑</button>
      </div>
      <div class="hint-row">
        <span id="hint">Enter ile gönder, Shift+Enter ile alt satıra geç.</span>
      </div>
    </div>
  </main>
</div>

<script>
const supabaseClient = window.supabase.createClient(
  "https://zqwfucqqbwrcevxohdby.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpxd2Z1Y3FxYndyY2V2eG9oZGJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NDAxNTMsImV4cCI6MjEwNDExNjE1M30.hG4TJz-xsjakB98KIOwnVzhm8xZkbJ_5WxmyCgR-HRI"
);

let sessions = [{ title: "Yeni Sohbet", history: [] }];
let currentSessionIndex = 0;
let currentSession = null;

const authScreen = document.getElementById("authScreen");
const authTitle = document.getElementById("authTitle");
const authEmail = document.getElementById("authEmail");
const authPassword = document.getElementById("authPassword");
const authSubmit = document.getElementById("authSubmit");
const authError = document.getElementById("authError");
const authSwitch = document.getElementById("authSwitch");
let isLoginMode = true;

authSwitch.addEventListener("click", () => {
  isLoginMode = !isLoginMode;
  authTitle.textContent = isLoginMode ? "Giriş Yap" : "Kayıt Ol";
  authSubmit.textContent = isLoginMode ? "Giriş Yap" : "Kayıt Ol";
  authSwitch.textContent = isLoginMode ? "Hesabın yok mu? Kayıt ol" : "Zaten hesabın var mı? Giriş yap";
  authError.textContent = "";
});

authSubmit.addEventListener("click", async () => {
  authError.textContent = "";
  const email = authEmail.value.trim();
  const password = authPassword.value;
  if (!email || !password) {
    authError.textContent = "E-posta ve şifre gerekli.";
    return;
  }

  authSubmit.disabled = true;
  try {
    if (isLoginMode) {
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) throw error;
      await onLoggedIn(data.session);
    } else {
      const { data, error } = await supabaseClient.auth.signUp({ email, password });
      if (error) throw error;
      if (data.session) {
        await onLoggedIn(data.session);
      } else {
        authError.textContent = "Kayıt başarılı! E-postanı kontrol et.";
      }
    }
  } catch (err) {
    authError.textContent = err.message;
  } finally {
    authSubmit.disabled = false;
  }
});

async function onLoggedIn(session) {
  currentSession = session;
  authScreen.classList.add("hidden");
  document.getElementById("userEmail").textContent = session.user.email;
  await refreshLimit();
}

async function refreshLimit() {
  const { data, error } = await supabaseClient
    .from("user_limits")
    .select("usage_today, daily_limit")
    .eq("id", currentSession.user.id)
    .single();
  if (!error && data) {
    document.getElementById("limitBadge").textContent = `Limit: ${data.usage_today}/${data.daily_limit}`;
  }
}

document.getElementById("logoutBtn").addEventListener("click", async () => {
  await supabaseClient.auth.signOut();
  currentSession = null;
  authScreen.classList.remove("hidden");
});

supabaseClient.auth.getSession().then(({ data }) => {
  if (data.session) onLoggedIn(data.session);
});

const messagesEl = document.getElementById("messages");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const statusEl = document.getElementById("status");
const modelSelect = document.getElementById("modelSelect");
const chatHistoryList = document.getElementById("chatHistoryList");

function renderMessages() {
  messagesEl.innerHTML = "";
  const currentHist = sessions[currentSessionIndex].history;
  if (currentHist.length === 0) {
    messagesEl.innerHTML = `<div class="msg ai">Merhaba! Ben Livanni AI. Bugün sana nasıl yardımcı olabilirim?</div>`;
    return;
  }
  currentHist.forEach(msg => {
    const div = document.createElement("div");
    div.className = "msg " + (msg.role === "user" ? "user" : "ai");
    div.innerHTML = escapeHTML(msg.content);
    messagesEl.appendChild(div);
  });
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function renderSidebar() {
  chatHistoryList.innerHTML = "";
  sessions.forEach((s, index) => {
    const item = document.createElement("div");
    item.className = "menu-item" + (index === currentSessionIndex ? " active" : "");
    item.textContent = s.title;
    item.onclick = () => loadSession(index);
    chatHistoryList.appendChild(item);
  });
}

function loadSession(index) {
  currentSessionIndex = index;
  renderMessages();
  renderSidebar();
}

document.getElementById("newChatBtn").addEventListener("click", () => {
  sessions.unshift({ title: "Yeni Sohbet", history: [] });
  currentSessionIndex = 0;
  renderMessages();
  renderSidebar();
  statusEl.textContent = "Hazır";
});

input.addEventListener("input", function() {
  this.style.height = "auto";
  this.style.height = (this.scrollHeight) + "px";
});

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    handleSend();
  }
});

sendBtn.addEventListener("click", handleSend);

async function handleSend() {
  const text = input.value.trim();
  if (!text || !currentSession) return;

  const activeSession = sessions[currentSessionIndex];
  if (activeSession.history.length === 0) {
    activeSession.title = text.length > 20 ? text.substring(0, 20) + "..." : text;
    renderSidebar();
  }

  activeSession.history.push({ role: "user", content: text });
  renderMessages();
  input.value = "";
  input.style.height = "auto";
  sendBtn.disabled = true;
  
  const selectedModel = modelSelect.value;
  statusEl.textContent = selectedModel === "gemini" ? "Gemini düşünüyor..." : "Claude düşünüyor...";

  try {
    const authHeader = { Authorization: `Bearer ${currentSession.access_token}` };
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json", ...authHeader },
      body: JSON.stringify({ messages: activeSession.history, model: selectedModel })
    });
    
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    
    activeSession.history.push({ role: "assistant", content: data.reply });
    renderMessages();
    statusEl.textContent = "Hazır";
    await refreshLimit();
  } catch (err) {
    statusEl.textContent = "Hata oluştu";
    activeSession.history.push({ role: "assistant", content: "Üzgünüm, bir hata oluştu: " + err.message });
    renderMessages();
  } finally {
    sendBtn.disabled = false;
  }
}

function escapeHTML(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}
</script>

</body>
</html>
